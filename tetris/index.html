<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <p class="eyebrow">经典规则</p>
        <h1>俄罗斯方块</h1>
      </header>

      <div class="layout">
        <section class="stage" aria-label="游戏棋盘">
          <canvas id="board" width="300" height="600" aria-label="10×20 游戏区域"></canvas>
          <p id="flash" class="flash" hidden></p>
          <div id="overlay" class="overlay">
            <div class="card">
              <h2 id="overlay-title">准备开始</h2>
              <p id="overlay-text">按任意键或点击按钮开始</p>
              <p id="overlay-score" class="overlay-score" hidden></p>
              <button id="action-btn" type="button">开始游戏</button>
            </div>
          </div>
        </section>

        <aside class="panel">
          <div class="stat next-box">
            <span>下一块</span>
            <canvas id="next" width="112" height="112" aria-label="下一块预览"></canvas>
          </div>
          <div class="stat">
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>最高分</span>
            <strong id="high">0</strong>
          </div>
          <div class="stat">
            <span>消行</span>
            <strong id="lines">0</strong>
          </div>
          <div class="stat">
            <span>等级</span>
            <strong id="level">1</strong>
          </div>
        </aside>
      </div>

      <p class="hint">← → 移动 · ↑ 旋转 · ↓ 软降 · 空格硬降 · P 暂停</p>

      <div class="touch" aria-label="触控操作">
        <button type="button" data-act="left">左</button>
        <button type="button" data-act="right">右</button>
        <button type="button" data-act="rotate">旋转</button>
        <button type="button" data-act="soft">下落</button>
        <button type="button" data-act="hard">硬降</button>
        <button type="button" data-act="pause">暂停</button>
      </div>
    </main>
    <script src="./game.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
