<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今日小决定</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">小小帮手</p>
      <h1>今日小决定</h1>
      <p class="lead">纠结的时候，让它帮你轻轻推一把～</p>
      <p class="hint">写下 2～6 个选项，点下面的大按钮，随机选一个。</p>

      <form id="options-form" class="options" aria-label="选项列表">
        <!-- 选项输入框会由 app.js 动态生成 -->
      </form>

      <div class="row-actions">
        <button type="button" id="add-btn" class="ghost">再加一个</button>
        <button type="button" id="remove-btn" class="ghost">去掉一个</button>
      </div>

      <button type="button" id="pick-btn" class="primary">帮我选一个</button>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </main>

    <p class="footer">上次的选项会记在这台电脑上，刷新页面也不会丢。</p>

    <script src="app.js"></script>
  </body>
</html>
